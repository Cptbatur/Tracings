<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tracings - UKHO T&P Route Checker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--card:#131d2a;--card2:#1a2840;--card3:#0f1926;
  --accent:#4D6F8A;--accent-l:#6990a8;--accent-d:#3a5569;
  --text:#e8edf2;--dim:#7a8fa8;
  --red:#e53e3e;--yellow:#d69e2e;--green:#38a169;
  --red-bg:rgba(229,62,62,.14);--yellow-bg:rgba(214,158,46,.14);
  --red-l:#fc8181;--yellow-l:#f6e05e;
  --border:rgba(77,111,138,.22);
  --nav-h:64px;--hdr-h:56px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px}
#app{display:flex;flex-direction:column;height:100vh}

#hdr{height:var(--hdr-h);background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px}
#hdr-title{font-size:16px;font-weight:700}
#hdr-stat{margin-left:auto;font-size:12px;color:var(--dim)}

#tab-wrap{flex:1;overflow:hidden;position:relative}
.tab{display:none;height:100%;overflow-y:auto;padding:14px}
.tab.active{display:block}
#tab-map{padding:0}

#bnav{height:var(--nav-h);background:var(--card);border-top:1px solid var(--border);
  display:flex}
.nbtn{flex:1;background:none;border:none;color:var(--dim);font-weight:600;font-size:12px;cursor:pointer}
.nbtn.active{color:var(--accent-l)}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.ctitle{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;margin-bottom:10px}

#drop-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;position:relative}
#drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

.setrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.setinp input{background:var(--card3);border:1px solid var(--border);color:#fff;padding:6px;width:70px;text-align:right;border-radius:6px}

#analyze-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}
#analyze-btn:disabled{opacity:.4}

#map-wrap{height:100%}
#lmap{height:100%;background:#0d1420}

.ritem{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);gap:10px}
.rdot{width:10px;height:10px;border-radius:50%}
.rdot-r{background:var(--red)}.rdot-y{background:var(--yellow)}
.rbody{flex:1}
.rid{font-size:12px;font-weight:700;color:var(--accent-l)}
.rtitle{font-size:13px;color:#fff}
.rdist{font-size:14px;font-weight:700}
.rdist.r{color:var(--red-l)}.rdist.y{color:var(--yellow-l)}
</style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <div id="hdr-title">⚓ Tracings</div>
    <div id="hdr-stat" id="stat-txt">Connecting…</div>
  </div>

  <div id="tab-wrap">
    <div id="tab-import" class="tab active">
      <div class="card">
        <div class="ctitle">1. Select Route File</div>
        <div id="drop-zone">
          <input type="file" id="file-inp" accept=".rtz,.gpx">
          <div>📁 Tap or Drop RTZ / GPX Route</div>
        </div>
      </div>

      <div class="card">
        <div class="ctitle">2. Safety Parameters</div>
        <div class="setrow">
          <span>Company Safety Distance (NM)</span>
          <div class="setinp"><input type="number" id="inp-safety" value="15"></div>
        </div>
        <div class="setrow">
          <span>XTD Corridor (NM)</span>
          <div class="setinp"><input type="number" id="inp-xtd" value="0.5"></div>
        </div>
      </div>

      <button id="analyze-btn" disabled onclick="runAnalysis()">⚓ ANALYZE ROUTE</button>
    </div>

    <div id="tab-map" class="tab">
      <div id="map-wrap"><div id="lmap"></div></div>
    </div>

    <div id="tab-report" class="tab">
      <div class="card">
        <div class="ctitle">Analysis Summary</div>
        <div id="summary-txt">No route analyzed yet.</div>
      </div>
      <div id="rpt-list"></div>
    </div>
  </div>

  <nav id="bnav">
    <button class="nbtn active" id="n-import" onclick="switchTab('import')">IMPORT</button>
    <button class="nbtn" id="n-map" onclick="switchTab('map')">MAP</button>
    <button class="nbtn" id="n-report" onclick="switchTab('report')">REPORT</button>
  </nav>
</div>

<script>
'use strict';

const S = { waypoints: [], tpRaw: [], results: [], map: null, mapReady: false, drawnGroup: null };
const DATA_URL = './data/tp_notices.json';

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nbtn').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  document.getElementById('n-' + t).classList.add('active');
  if (t === 'map') {
    if (!S.mapReady) initMap();
    else setTimeout(() => S.map && S.map.invalidateSize(), 100);
  }
}

async function fetchStatusAndData() {
  try {
    const r = await fetch(DATA_URL);
    const d = await r.json();
    S.tpRaw = d.notices || [];
    document.getElementById('hdr-stat').textContent = S.tpRaw.length + ' notices ready';
  } catch (e) {
    document.getElementById('hdr-stat').textContent = 'JSON Error';
  }
}

function parseRTZ(txt) {
  const doc = new DOMParser().parseFromString(txt.replace(/ xmlns(?::\w+)?="[^"]*"/g, ''), 'application/xml');
  const wps = [];
  doc.querySelectorAll('waypoint').forEach(w => {
    const pos = w.querySelector('position');
    const lat = parseFloat(pos ? pos.getAttribute('lat') : w.getAttribute('lat'));
    const lon = parseFloat(pos ? pos.getAttribute('lon') : w.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) wps.push({ lat, lon });
  });
  return wps;
}

document.getElementById('file-inp').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const txt = await file.text();
  S.waypoints = parseRTZ(txt);
  if (S.waypoints.length >= 2) {
    document.getElementById('analyze-btn').disabled = false;
    alert('Route loaded successfully: ' + S.waypoints.length + ' Waypoints');
  } else {
    alert('Failed to parse RTZ route');
  }
});

const R_NM = 3440.065;
function toR(d) { return d * Math.PI / 180; }
function hvNM(la1, lo1, la2, lo2) {
  const dLa = toR(la2 - la1), dLo = toR(lo2 - lo1);
  const a = Math.sin(dLa/2)**2 + Math.cos(toR(la1))*Math.cos(toR(la2))*Math.sin(dLo/2)**2;
  return 2 * R_NM * Math.asin(Math.sqrt(Math.min(1, a)));
}

/* Noktanın rota bacağına (segment) olan dikme / cross-track mesafesi */
function ptToSegmentNM(plat, plon, la1, lo1, la2, lo2) {
  const segLen = hvNM(la1, lo1, la2, lo2);
  if (segLen < 1e-6) return hvNM(plat, plon, la1, lo1);

  const meanLat = toR((la1 + la2 + plat) / 3);
  const cosL = Math.cos(meanLat);

  const px = (plon - lo1) * 60 * cosL;
  const py = (plat - la1) * 60;
  const dx = (lo2 - lo1) * 60 * cosL;
  const dy = (la2 - la1) * 60;

  const segSq = dx*dx + dy*dy;
  if (segSq < 1e-6) return hvNM(plat, plon, la1, lo1);

  const t = Math.max(0, Math.min(1, (px * dx + py * dy) / segSq));
  const projLat = la1 + t * (la2 - la1);
  const projLon = lo1 + t * (lo2 - lo1);

  return hvNM(plat, plon, projLat, projLon);
}

function getNoticeDistance(notice, wps) {
  const coords = notice.coordinates || [];
  if (!coords.length) return Infinity;
  if (wps.length < 2) return Infinity;
  let minD = Infinity;

  for (const [la, lo] of coords) {
    for (let i = 0; i < wps.length - 1; i++) {
      const d = ptToSegmentNM(la, lo, wps[i].lat, wps[i].lon, wps[i+1].lat, wps[i+1].lon);
      if (d < minD) minD = d;
    }
  }
  return minD;
}

function runAnalysis() {
  const safetyDist = parseFloat(document.getElementById('inp-safety').value) || 15;
  const xtd = parseFloat(document.getElementById('inp-xtd').value) || 0.5;

  const results = [];
  for (const notice of S.tpRaw) {
    if (!notice.has_coordinates) continue;
    const dist = getNoticeDistance(notice, S.waypoints);
    if (dist <= safetyDist) {
      const color = dist <= xtd ? 'red' : 'yellow';
      results.push({ notice, color, distance: Math.round(dist * 10) / 10 });
    }
  }

  results.sort((a,b) => a.distance - b.distance);
  S.results = results;

  if (!S.mapReady) initMap();
  renderRoute();
  renderMarkers();
  renderReport();
  switchTab('map');
}

function initMap() {
  const map = L.map('lmap', { center:[35, 15], zoom:3 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  S.map = map;
  S.mapReady = true;
  S.drawnGroup = L.layerGroup().addTo(map);
}

function renderRoute() {
  if (S.routeLayer) S.map.removeLayer(S.routeLayer);
  const ll = S.waypoints.map(w => [w.lat, w.lon]);
  S.routeLayer = L.polyline(ll, { color:'#4D6F8A', weight:4 }).addTo(S.map);
  S.map.fitBounds(S.routeLayer.getBounds(), { padding:[40,40] });
}

function renderMarkers() {
  if (S.drawnGroup) S.drawnGroup.clearLayers();

  for (const r of S.results) {
    const coords = r.notice.coordinates || [];
    const hex = r.color === 'red' ? '#e53e3e' : '#d69e2e';

    if (r.notice.geometry_type === 'LINE' && coords.length >= 2) {
      L.polyline(coords, { color:hex, weight:3 }).addTo(S.drawnGroup);
    } else if (r.notice.geometry_type === 'AREA' && coords.length >= 3) {
      L.polygon(coords, { color:hex, weight:2, fillColor:hex, fillOpacity:0.3 }).addTo(S.drawnGroup);
    } else {
      coords.forEach(pt => {
        L.circleMarker(pt, { radius:6, fillColor:hex, color:'#fff', weight:1, fillOpacity:0.9 })
         .bindPopup(`<b>${r.notice.id}</b><br>${r.notice.title}`)
         .addTo(S.drawnGroup);
      });
    }
  }
}

function renderReport() {
  const list = document.getElementById('rpt-list');
  const rc = S.results.filter(r => r.color === 'red').length;
  const yc = S.results.filter(r => r.color === 'yellow').length;

  document.getElementById('summary-txt').textContent = `Found ${rc} Critical (Red) and ${yc} Caution (Yellow) notices near your route.`;

  list.innerHTML = S.results.map(r => `
    <div class="ritem">
      <div class="rdot rdot-${r.color === 'red' ? 'r' : 'y'}"></div>
      <div class="rbody">
        <div class="rid">${r.notice.id}</div>
        <div class="rtitle">${r.notice.title}</div>
      </div>
      <div class="rdist ${r.color === 'red' ? 'r' : 'y'}">${r.distance} NM</div>
    </div>
  `).join('');
}

fetchStatusAndData();
</script>
</body>
</html>
