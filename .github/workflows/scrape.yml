name: UKHO T&P Auto Scraper

on:
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper'ı Çalıştır
        run: python scraper.py

      - name: Güncellenmiş JSON'u Repoya Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/tp_notices.json pdf_cache/ 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Auto-update T&P data [skip ci]"
          git push
